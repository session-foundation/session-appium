name: iOS regression tests
run-name: '${{ inputs.RISK }} regressions on ${{ github.head_ref || github.ref }}'

on:
  workflow_dispatch:
    inputs:
      NETWORK_TARGET:
        description: 'network target to run the tests on'
        required: true
        type: choice
        options:
          - 'devnet'
          - 'testnet'
          - 'mainnet'
        default: 'mainnet'

      APK_URL:
        description: 'ipa url to test (.tar.xz)'
        required: true
        type: string

      BUILD_NUMBER:
        description: 'build number used for the report (e.g. 2.11.0)'
        required: true
        type: string

      RISK:
        description: 'risks to target'
        required: false
        type: choice
        options:
          - 'high-risk'
          - 'medium-risk'
          - 'low-risk'
          - ''

      RUN_PRO_TESTS:
        description: 'include Session Pro tests in this run'
        required: false
        default: false
        type: boolean

      ALLURE_ENABLED:
        description: 'generate allure report'
        required: false
        default: true
        type: boolean

      PLAYWRIGHT_RETRIES_COUNT:
        description: 'retries of failing tests to do at most'
        required: true
        type: choice
        options:
          - '0'
          - '1'
          - '2'
        default: '0'

      PLAYWRIGHT_WORKERS_COUNT_IOS:
        description: 'number of workers to use (ios only)'
        required: true
        type: choice
        options:
          - '1'
          - '2'
          - '3'
        default: '3'

      LOG_LEVEL:
        description: 'Test logging verbosity (WARNING: anything other than minimal mode may crash GitHub Actions on large test runs)'
        required: true
        type: choice
        options:
          - 'minimal' # Recommended for full regressions
          - 'failures' # Show failed test logs only
          - 'verbose' # All test logs - use with caution!
        default: 'minimal'

permissions:
  contents: write

jobs:
  ios-regression:
    runs-on: [self-hosted, macOS]
    env:
      PLATFORM: 'ios'
      APK_URL: ${{ github.event.inputs.APK_URL }}
      BUILD_NUMBER: ${{ github.event.inputs.BUILD_NUMBER }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CI: 1
      ALLURE_ENABLED: ${{ github.event.inputs.ALLURE_ENABLED }}
      ANDROID_APK: '<just_not_empty>'
      APPIUM_ADB_FULL_PATH: '<just_not_empty>'
      ANDROID_SDK_ROOT: '<just_not_empty>'
      PLAYWRIGHT_RETRIES_COUNT: ${{ github.event.inputs.PLAYWRIGHT_RETRIES_COUNT }}
      # iOS selects the network at launch (one build, no AQA/regular variants like Android):
      # NETWORK_TARGET drives capabilities_ios.ts + getNetworkTarget (and is used for the report).
      # For devnet the app also needs the seed-node connection details below; they are only read
      # when devnet is selected, so they are harmless on mainnet/testnet runs. Store them as
      # repo-level Actions *variables* (the pubkey is public; the IP/ports are internal), e.g.
      # Settings > Secrets and variables > Actions. The seed node exposes three ports the tests use:
      # DEVNET_RPC_PORT (oxend RPC — the seeder), DEVNET_HTTP_PORT (storage HTTPS — the app) and
      # DEVNET_OMQ_PORT (storage OMQ/QUIC — the app). See docs/local-devnet.md.
      NETWORK_TARGET: ${{ github.event.inputs.NETWORK_TARGET }}
      DEVNET_PUBKEY: ${{ vars.DEVNET_PUBKEY }}
      DEVNET_IP: ${{ vars.DEVNET_IP }}
      DEVNET_RPC_PORT: ${{ vars.DEVNET_RPC_PORT }}
      DEVNET_HTTP_PORT: ${{ vars.DEVNET_HTTP_PORT }}
      DEVNET_OMQ_PORT: ${{ vars.DEVNET_OMQ_PORT }}
      _TESTING: 1 # Always hide webdriver logs (@appium/support/ flag)
      PRINT_FAILED_TEST_LOGS: ${{ github.event.inputs.LOG_LEVEL != 'minimal' && '1' || '0' }} # Show stdout/stderr if test fails (@session-foundation/playwright-reporter/ flag)
      PRINT_ONGOING_TEST_LOGS: ${{ github.event.inputs.LOG_LEVEL == 'verbose' && '1' || '0' }} # Show everything as it happens (@session-foundation/playwright-reporter/ flag)
      PLAYWRIGHT_WORKERS_COUNT_IOS: ${{ github.event.inputs.PLAYWRIGHT_WORKERS_COUNT_IOS }} # defaults to 3, the max on our self-hosted runner
      SOGS_ADMIN_SEED: ${{ secrets.SOGS_ADMIN_SEED }}
      PRO_GREP_INVERT: ${{ inputs.RUN_PRO_TESTS != true && '--grep-invert @pro' || '' }}

    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
          submodules: 'recursive'

      - name: Fetch result history from gh-pages
        uses: ./github/actions/fetch-allure-history
        if: ${{ env.ALLURE_ENABLED == 'true' }}
        with:
          PLATFORM: ${{ env.PLATFORM }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Fail fast (before the app download / sim setup) if devnet was requested but its
      # connection details are missing or the seed node is unreachable. Mirrors the Android
      # workflow's probe. On mainnet this step is skipped entirely.
      - name: Probe devnet reachability
        if: ${{ github.event.inputs.NETWORK_TARGET == 'devnet' }}
        shell: bash
        run: |
          if [ -z "$DEVNET_PUBKEY" ] || [ -z "$DEVNET_IP" ] || [ -z "$DEVNET_RPC_PORT" ] || [ -z "$DEVNET_HTTP_PORT" ] || [ -z "$DEVNET_OMQ_PORT" ]; then
            echo "ERROR: NETWORK_TARGET=devnet but not all DEVNET_* Actions variables are set"
            echo "  DEVNET_PUBKEY set? $([ -n "$DEVNET_PUBKEY" ] && echo yes || echo NO)"
            echo "  DEVNET_IP='$DEVNET_IP' DEVNET_RPC_PORT='$DEVNET_RPC_PORT' DEVNET_HTTP_PORT='$DEVNET_HTTP_PORT' DEVNET_OMQ_PORT='$DEVNET_OMQ_PORT'"
            exit 1
          fi
          # Probe the seeder's endpoint (oxend RPC); the app's storage ports are validated in-harness.
          SEED="http://${DEVNET_IP}:${DEVNET_RPC_PORT}"
          echo "Requested devnet -> probing seed node $SEED"
          for attempt in 1 2 3; do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' --connect-timeout 5 --max-time 10 "$SEED" 2>/dev/null || echo '000')
            if [ "$CODE" != "000" ]; then echo "Devnet reachable (HTTP $CODE)"; exit 0; fi
            echo "attempt $attempt/3 failed"; [ "$attempt" -lt 3 ] && sleep "$attempt"
          done
          echo "ERROR: devnet seed node $SEED not reachable after 3 attempts"; exit 1

      # Downloaded AND extracted under $HOME, deliberately, rather than into the workspace.
      #
      # `simctl install` can clone the app bundle instead of copying its ~237MB, but only within a single
      # APFS volume — and the simulators live at $HOME/Library/Developer/CoreSimulator. Self-hosted
      # runners commonly put the workspace on a separate data disk, which would make every one of the
      # twelve installs a real byte copy: measured at ~12s per device here against ~1s locally, and ~13s
      # on the very first device with an idle host, so it is not contention. Anything under $HOME is
      # guaranteed to share the simulators' volume, and extracting here costs nothing over extracting
      # into the workspace. `Prepare simulators` logs whether the two volumes actually differ.
      #
      # Everything stays on that volume: the archive is downloaded there too, so the final `mv` is a
      # same-volume rename rather than a copy. IOS_APP_PATH_PREFIX is exported rather than set as a
      # job-level `env:`, because a job-level value would override what this step writes to GITHUB_ENV.
      - name: Download ipa and extract it
        shell: bash
        run: |
          APP_DIR="$HOME/session-ios-app"
          rm -rf "$APP_DIR"   # $HOME is not cleaned between runs the way the workspace is
          mkdir -p "$APP_DIR"
          curl -o "$APP_DIR/session-ios.sim.tar.xz" ${{ github.event.inputs.APK_URL }}
          tar -tf "$APP_DIR/session-ios.sim.tar.xz"
          tar xf "$APP_DIR/session-ios.sim.tar.xz" -C "$APP_DIR"
          mv "$APP_DIR"/session-ios-*-sim/*.app "$APP_DIR"/
          rm -f "$APP_DIR/session-ios.sim.tar.xz"
          ls -la "$APP_DIR"
          echo "IOS_APP_PATH_PREFIX=$APP_DIR/Session.app" >> "$GITHUB_ENV"

      - name: Setup for both platforms
        uses: ./github/actions/setup

      - name: Stop simulators
        shell: bash
        run: |
          npx --yes ts-node scripts/stop_ios.ts

      # Boot the pool, install the app on it, and start one WebDriverAgent per simulator, before any
      # test runs. global-setup.ts can do this itself and does locally, but the run below is tiered —
      # one `playwright test` invocation per device class — so leaving it there would repeat the whole
      # preparation once per pass. As its own step it happens once, its cost is visible in the job
      # timing rather than charged to the first pass, and the xcodebuild output stays out of the test
      # results. It exports IOS_SIMULATORS_PREPARED, which tells global setup to skip to discovering the
      # WebDriverAgents this started.
      #
      # Never fails the job: every part of it has a working fallback (the driver boots, installs and
      # launches WDA on demand), so a problem here should not stop the tests from running.
      - name: Prepare simulators
        shell: bash
        timeout-minutes: 30
        run: |
          npx --yes ts-node scripts/prepare_ios.ts

      - name: List tests part of this run
        uses: ./github/actions/list-tests
        with:
          PLATFORM: ${{ env.PLATFORM }}
          RISK: ${{ github.event.inputs.RISK }}
          PRO_GREP_INVERT: ${{ env.PRO_GREP_INVERT }}

      - name: Run the iOS tests​​ (tiered by device count)
        env:
          _TESTING: ${{ env._TESTING }}
          PRINT_FAILED_TEST_LOGS: ${{ env.PRINT_FAILED_TEST_LOGS }}
          PRINT_ONGOING_TEST_LOGS: ${{ env.PRINT_ONGOING_TEST_LOGS }}
          PARALLEL_TIER: ci
        run: |
          set -uo pipefail
          # One Playwright invocation per device class, driven by run/constants/parallelism.ts so the
          # worker counts live in one place rather than being duplicated here.
          #
          # Why not a single run: DEVICES_PER_TEST_COUNT is one global per invocation, so a single run
          # must size every worker's pool for the largest spec — a @1-devices spec then occupies a
          # worker holding 4 simulators and using 1. Passes run in sequence, so the simulator draw is
          # the largest pass, not the sum.
          #
          # Allure results accumulate across invocations (the reporter does not clear resultsDir), so
          # the report step below still sees one merged run.

          PASSES="$(npx --yes ts-node scripts/print_tier.ts "$PARALLEL_TIER")"
          # An empty table would otherwise run zero tests and report success.
          if [ -z "$PASSES" ]; then
            echo "::error::print_tier.ts produced no passes for tier '$PARALLEL_TIER'"
            exit 1
          fi
          echo "Tier '$PARALLEL_TIER' passes (devices workers):"
          echo "$PASSES"

          overall=0
          summary=""
          while read -r DEVICES WORKERS; do
            [ -n "$DEVICES" ] || continue
            label="@${DEVICES}-devices x${WORKERS} worker(s) ($((DEVICES * WORKERS)) simulators)"

            # Deliberately NOT wrapped in a ::group::. Groups don't nest in Actions, and the useful
            # grouping is one level down — the WDA build and each test (run/types/ci_group_reporter.ts)
            # — which a pass-level group would swallow. A pass-level group also rendered a failing step
            # as nothing but headers and an exit code.
            echo "--- $label ---"
            status=0
            # --pass-with-no-tests: a RISK filter can legitimately empty one device class while the
            # others still have work, and that must not fail the run.
            DEVICES_PER_TEST_COUNT="$DEVICES" \
            PLAYWRIGHT_WORKERS_COUNT_IOS="$WORKERS" \
            npx playwright test \
              --grep "(?=.*@${PLATFORM})(?=.*@${{ github.event.inputs.RISK }})(?=.*@${DEVICES}-devices)" \
              --pass-with-no-tests \
              $PRO_GREP_INVERT || status=$?

            if [ "$status" -eq 0 ]; then
              echo "PASS  $label"
              summary="${summary}PASS  ${label}"$'\n'
            else
              # ::error:: surfaces as a job annotation, so the failing pass is visible without
              # opening the log at all.
              echo "::error::FAILED  $label (exit $status)"
              summary="${summary}FAIL  ${label} (exit ${status})"$'\n'
              overall=1
            fi
          done <<< "$PASSES"

          echo "Tier '$PARALLEL_TIER' summary:"
          printf '%s' "$summary"

          # Every pass runs even if an earlier one failed, so the report covers the whole suite.
          exit $overall

      - name: Generate and publish test report
        uses: ./github/actions/generate-publish-test-report
        if: ${{ always() && env.ALLURE_ENABLED == 'true' }}
        with:
          PLATFORM: ${{ env.PLATFORM }}
          BUILD_NUMBER: ${{ env.BUILD_NUMBER }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APK_URL: ${{env.APK_URL}}
          RISK: ${{github.event.inputs.RISK}}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          NETWORK_TARGET: ${{ env.NETWORK_TARGET }}

      - name: Upload results of this run
        uses: ./github/actions/upload-test-results
        with:
          PLATFORM: ${{ env.PLATFORM }}
          UPLOAD_IDENTIFIER: 'devices-other-test-run'

      - name: Upload csv of this whole run
        uses: ./github/actions/upload-csv-test-results
        if: always()
        with:
          PLATFORM: ${{ env.PLATFORM }}

      - name: Stop emulators
        if: always()
        continue-on-error: true # just so we don't fail
        shell: bash
        run: |
          source ./scripts/ci.sh
          npx --yes ts-node scripts/stop_ios.ts
