name: iOS regression tests
run-name: '${{ inputs.RISK }} regressions on ${{ github.head_ref || github.ref }}'

on:
  workflow_dispatch:
    inputs:
      NETWORK_TARGET:
        description: 'network target to run the tests on'
        required: true
        type: choice
        options:
          - 'devnet'
          - 'testnet'
          - 'mainnet'
        default: 'mainnet'

      DEVNET_BOOTSTRAP:
        description: 'devnet seed node as host:port (only used when NETWORK_TARGET=devnet)'
        required: false
        type: string
        default: '192.168.1.114:1280'

      APK_URL:
        description: 'ipa url to test (.tar.xz)'
        required: true
        type: string

      BUILD_NUMBER:
        description: 'build number used for the report (e.g. 2.11.0)'
        required: true
        type: string

      RISK:
        description: 'risks to target'
        required: false
        type: choice
        options:
          - 'high-risk'
          - 'medium-risk'
          - 'low-risk'
          - ''

      RUN_PRO_TESTS:
        description: 'include Session Pro tests in this run'
        required: false
        default: false
        type: boolean

      ALLURE_ENABLED:
        description: 'generate allure report'
        required: false
        default: true
        type: boolean

      PLAYWRIGHT_RETRIES_COUNT:
        description: 'retries of failing tests to do at most'
        required: true
        type: choice
        options:
          - '0'
          - '1'
          - '2'
        default: '0'

      PLAYWRIGHT_WORKERS_COUNT_IOS:
        description: 'number of workers to use (ios only)'
        required: true
        type: choice
        options:
          - '1'
          - '2'
          - '3'
        default: '3'

      LOG_LEVEL:
        description: 'Test logging verbosity (WARNING: anything other than minimal mode may crash GitHub Actions on large test runs)'
        required: true
        type: choice
        options:
          - 'minimal' # Recommended for full regressions
          - 'failures' # Show failed test logs only
          - 'verbose' # All test logs - use with caution!
        default: 'minimal'

permissions:
  contents: write

jobs:
  ios-regression:
    runs-on: [self-hosted, macOS]
    env:
      PLATFORM: 'ios'
      APK_URL: ${{ github.event.inputs.APK_URL }}
      BUILD_NUMBER: ${{ github.event.inputs.BUILD_NUMBER }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CI: 1
      ALLURE_ENABLED: ${{ github.event.inputs.ALLURE_ENABLED }}
      IOS_APP_PATH_PREFIX: './extracted/Session.app'
      ANDROID_APK: '<just_not_empty>'
      APPIUM_ADB_FULL_PATH: '<just_not_empty>'
      ANDROID_SDK_ROOT: '<just_not_empty>'
      PLAYWRIGHT_RETRIES_COUNT: ${{ github.event.inputs.PLAYWRIGHT_RETRIES_COUNT }}
      # iOS selects the network at launch (one build, no AQA/regular variants like Android):
      # NETWORK_TARGET drives capabilities_ios.ts + getNetworkTarget (and is used for the report).
      #
      # For devnet the app also needs the seed node's pubkey/IP/ports. Those are NOT declared here:
      # the "Resolve and probe devnet" step derives them from the devnet itself and exports them via
      # $GITHUB_ENV, and a job-level `env:` entry would take precedence over $GITHUB_ENV and shadow
      # the resolved values. Optional `vars.DEVNET_*` overrides are passed in at that step instead.
      # See docs/local-devnet.md.
      NETWORK_TARGET: ${{ github.event.inputs.NETWORK_TARGET }}
      _TESTING: 1 # Always hide webdriver logs (@appium/support/ flag)
      PRINT_FAILED_TEST_LOGS: ${{ github.event.inputs.LOG_LEVEL != 'minimal' && '1' || '0' }} # Show stdout/stderr if test fails (@session-foundation/playwright-reporter/ flag)
      PRINT_ONGOING_TEST_LOGS: ${{ github.event.inputs.LOG_LEVEL == 'verbose' && '1' || '0' }} # Show everything as it happens (@session-foundation/playwright-reporter/ flag)
      PLAYWRIGHT_WORKERS_COUNT_IOS: ${{ github.event.inputs.PLAYWRIGHT_WORKERS_COUNT_IOS }} # defaults to 3, the max on our self-hosted runner
      SOGS_ADMIN_SEED: ${{ secrets.SOGS_ADMIN_SEED }}
      PRO_GREP_INVERT: ${{ inputs.RUN_PRO_TESTS != true && '--grep-invert @pro' || '' }}

    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
          submodules: 'recursive'

      - name: Fetch result history from gh-pages
        uses: ./github/actions/fetch-allure-history
        if: ${{ env.ALLURE_ENABLED == 'true' }}
        with:
          PLATFORM: ${{ env.PLATFORM }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Fail fast (before the app download / sim setup) if devnet was requested but the seed node is
      # unreachable, then derive the connection details from the devnet rather than requiring them to
      # be maintained by hand. Mirrors the Android workflow's probe, which uses the same bootstrap
      # address. On mainnet/testnet this step is skipped entirely.
      #
      # Only the bootstrap address is configuration. Everything else comes from the seed's
      # get_service_nodes RPC (see scripts/resolve_devnet.ts), which matters for two reasons: the
      # pubkey is regenerated whenever the devnet is recreated, and the storage ports differ per node
      # — so neither can be a hardcoded default. The IP is read from the registry, so it is by
      # construction the address the client will be handed.
      - name: Resolve and probe devnet
        if: ${{ github.event.inputs.NETWORK_TARGET == 'devnet' }}
        shell: bash
        env:
          # Editable per run via the DEVNET_BOOTSTRAP input, so moving the devnet does not need a code
          # change. Accepts host, host:port or a full URL. `vars.DEVNET_BOOTSTRAP_HOST` remains as a
          # repo-level fallback for when the input is blanked.
          DEVNET_BOOTSTRAP_HOST: ${{ github.event.inputs.DEVNET_BOOTSTRAP || vars.DEVNET_BOOTSTRAP_HOST || '192.168.1.114:1280' }}
          # Optional pins. Each is left alone if set, so a variable still overrides autodetection.
          DEVNET_PUBKEY: ${{ vars.DEVNET_PUBKEY }}
          DEVNET_IP: ${{ vars.DEVNET_IP }}
          DEVNET_RPC_PORT: ${{ vars.DEVNET_RPC_PORT }}
          DEVNET_HTTP_PORT: ${{ vars.DEVNET_HTTP_PORT }}
          DEVNET_OMQ_PORT: ${{ vars.DEVNET_OMQ_PORT }}
        run: |
          set -uo pipefail
          BOOT="http://${DEVNET_BOOTSTRAP_HOST}:${DEVNET_RPC_PORT:-1280}"
          echo "Requested devnet -> resolving from $BOOT"

          # Retry around resolve_devnet.ts itself rather than a separate curl probe. A second
          # reachability check is only another thing that can disagree with the real one, and the
          # naive form of it is subtly wrong: `curl -w '%{http_code}' ... || echo 000` yields
          # "000000" on a failed connection — curl prints its own 000 *and* exits non-zero — which is
          # != "000" and therefore reads as success. The script's exit status is the single signal.
          RESOLVED=""
          for attempt in 1 2 3; do
            if RESOLVED="$(npx --yes ts-node scripts/resolve_devnet.ts)"; then
              break
            fi
            echo "attempt $attempt/3 failed"
            if [ "$attempt" = 3 ]; then
              echo "::error::could not resolve devnet from $BOOT after 3 attempts"
              exit 1
            fi
            sleep "$attempt"
          done

          # An empty result would otherwise leave the harness to fall back to testnet silently.
          if [ -z "$RESOLVED" ]; then
            echo "::error::resolve_devnet.ts produced no values"
            exit 1
          fi
          echo "$RESOLVED" >> "$GITHUB_ENV"
          echo "Resolved devnet details (all non-secret — the pubkey is a service-node public key):"
          echo "$RESOLVED"

      - name: Download ipa and extract it
        run: |
          curl -o session-ios.sim.tar.xz ${{ github.event.inputs.APK_URL }}
          ls
          pwd
          tar -tf session-ios.sim.tar.xz
          tar xf session-ios.sim.tar.xz
          mkdir -p extracted
          mv session-ios-*-sim/*.app extracted/
          ls extracted

      - name: Setup for both platforms
        uses: ./github/actions/setup

      - name: Stop simulators
        shell: bash
        run: |
          npx --yes ts-node scripts/stop_ios.ts

      - name: Start simulators
        shell: bash
        if: false # appium is starting the simulators (seems to be somewhat more reliable)
        run: |
          npx --yes ts-node scripts/start_ios.ts # don't auto start the simulators, let appium do it (seems somewhat more reliable)

      - name: List tests part of this run
        uses: ./github/actions/list-tests
        with:
          PLATFORM: ${{ env.PLATFORM }}
          RISK: ${{ github.event.inputs.RISK }}
          PRO_GREP_INVERT: ${{ env.PRO_GREP_INVERT }}

      - name: Run the iOS tests​​ (tiered by device count)
        env:
          _TESTING: ${{ env._TESTING }}
          PRINT_FAILED_TEST_LOGS: ${{ env.PRINT_FAILED_TEST_LOGS }}
          PRINT_ONGOING_TEST_LOGS: ${{ env.PRINT_ONGOING_TEST_LOGS }}
          PARALLEL_TIER: ci
        run: |
          # One Playwright invocation per device class, driven by run/constants/parallelism.ts so the
          # worker counts live in one place rather than being duplicated here.
          #
          # Why not a single run: DEVICES_PER_TEST_COUNT is one global per invocation, so a single run
          # must size every worker's pool for the largest spec — a @1-devices spec then occupies a
          # worker holding 4 simulators and using 1. Passes run in sequence, so the simulator draw is
          # the largest pass, not the sum.
          #
          # Allure results accumulate across invocations (the reporter does not clear resultsDir), so
          # the report step below still sees one merged run.
          set -uo pipefail

          PASSES="$(npx --yes ts-node scripts/print_tier.ts "$PARALLEL_TIER")"
          # An empty table would otherwise run zero tests and report success.
          if [ -z "$PASSES" ]; then
            echo "::error::print_tier.ts produced no passes for tier '$PARALLEL_TIER'"
            exit 1
          fi
          echo "Tier '$PARALLEL_TIER' passes (devices workers):"
          echo "$PASSES"

          overall=0
          while read -r DEVICES WORKERS; do
            [ -n "$DEVICES" ] || continue
            echo "::group::@${DEVICES}-devices x${WORKERS} worker(s) ($((DEVICES * WORKERS)) simulators)"
            # --pass-with-no-tests: a RISK filter can legitimately empty one device class while the
            # others still have work, and that must not fail the run.
            DEVICES_PER_TEST_COUNT="$DEVICES" \
            PLAYWRIGHT_WORKERS_COUNT_IOS="$WORKERS" \
            npx playwright test \
              --grep "(?=.*@${PLATFORM})(?=.*@${{ github.event.inputs.RISK }})(?=.*@${DEVICES}-devices)" \
              --pass-with-no-tests \
              $PRO_GREP_INVERT || overall=1
            echo "::endgroup::"
          done <<< "$PASSES"

          # Every pass runs even if an earlier one failed, so the report covers the whole suite.
          exit $overall

      - name: Generate and publish test report
        uses: ./github/actions/generate-publish-test-report
        if: ${{ always() && env.ALLURE_ENABLED == 'true' }}
        with:
          PLATFORM: ${{ env.PLATFORM }}
          BUILD_NUMBER: ${{ env.BUILD_NUMBER }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APK_URL: ${{env.APK_URL}}
          RISK: ${{github.event.inputs.RISK}}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          NETWORK_TARGET: ${{ env.NETWORK_TARGET }}

      - name: Upload results of this run
        uses: ./github/actions/upload-test-results
        with:
          PLATFORM: ${{ env.PLATFORM }}
          UPLOAD_IDENTIFIER: 'devices-other-test-run'

      - name: Upload csv of this whole run
        uses: ./github/actions/upload-csv-test-results
        if: always()
        with:
          PLATFORM: ${{ env.PLATFORM }}

      - name: Stop emulators
        if: always()
        continue-on-error: true # just so we don't fail
        shell: bash
        run: |
          source ./scripts/ci.sh
          npx --yes ts-node scripts/stop_ios.ts
