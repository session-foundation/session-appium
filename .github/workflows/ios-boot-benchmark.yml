name: iOS simulator boot benchmark

run-name: 'boot benchmark (widths ${{ inputs.WIDTHS }}) on ${{ github.head_ref || github.ref }}'

# Measures how long the 12-simulator pool takes to cold-boot at several concurrency widths, on the
# runner itself, so IOS_BOOT_CONCURRENCY can be set from the host's own numbers instead of extrapolated
# from a developer laptop.
#
# Its own workflow rather than a step in ios-regression.yml: it shuts every simulator down repeatedly
# and takes ~10 minutes, so it must never run alongside a regression job on the same self-hosted runner
# — and there is no reason to pay for it on every run once the width is chosen.
on:
  workflow_dispatch:
    inputs:
      WIDTHS:
        description: 'boot concurrency widths to compare (space-separated; blank = 1 2 3 4 6 12)'
        required: false
        type: string
        default: ''

jobs:
  boot-benchmark:
    runs-on: [self-hosted, macOS]
    # Six widths x (cold boot + settle) is ~15 minutes; this is a stop rather than a budget, so a
    # wedged simulator can't hold the self-hosted runner for GitHub's default six hours.
    timeout-minutes: 45

    env:
      CI: 1 # Selects ci-simulators.json as the simulator pool (see resolveRunSimulators).

    steps:
      - uses: actions/checkout@v6

      - name: Print runner details
        uses: ./github/actions/print-runner-details

      - name: Setup for both platforms
        uses: ./github/actions/setup

      - name: Benchmark simulator boot widths
        shell: bash
        run: |
          npx --yes ts-node scripts/bench_simulator_boot.ts ${{ inputs.WIDTHS }}

      # The benchmark leaves the pool shut down, but a cancelled or failed run may not have — and a
      # regression job starting into 12 booted simulators would measure something other than itself.
      - name: Stop simulators
        if: always()
        shell: bash
        run: |
          npx --yes ts-node scripts/stop_ios.ts
