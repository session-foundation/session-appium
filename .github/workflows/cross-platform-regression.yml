name: Cross-platform regression tests
run-name: 'cross-platform (iOS + Desktop) regressions on ${{ github.head_ref || github.ref }}'

# Runs the cross-platform specs (run/test/specs/cross_platform/), which drive an iOS simulator and
# a Desktop client from a SINGLE Playwright worker. Both clients therefore have to live on the same
# machine, and iOS needs macOS — hence the self-hosted macOS runner. These specs are tagged
# @cross-platform (not @ios/@android) so ios-regression.yml / android-regression.yml never collect
# them; this workflow is the only thing that runs them.
#
# No Allure: cross-platform runs are reported through the run log + the uploaded CSV/artifacts only.

on:
  workflow_dispatch:
    inputs:
      NETWORK_TARGET:
        description: 'network target to run the tests on (both clients are pinned to it)'
        required: true
        type: choice
        options:
          - 'mainnet'
          - 'testnet'
          - 'devnet'
        default: 'mainnet'

      APK_URL:
        description: 'ipa url to test (.tar.xz)'
        required: true
        type: string

      DESKTOP_REF:
        description: 'session-desktop branch/tag/SHA to build and test against'
        required: true
        type: string
        default: 'dev'

      SPEC_GREP:
        description: 'which cross-platform specs to run (matched against the Playwright test title, which includes the spec file path)'
        required: true
        type: string
        default: 'cross_platform/.*_ios\.spec\.ts'

      PLAYWRIGHT_RETRIES_COUNT:
        description: 'retries of failing tests to do at most'
        required: true
        type: choice
        options:
          - '0'
          - '1'
          - '2'
        default: '0'

      LOG_LEVEL:
        description: 'Test logging verbosity (WARNING: anything other than minimal mode may crash GitHub Actions on large test runs)'
        required: true
        type: choice
        options:
          - 'minimal' # Recommended for full regressions
          - 'failures' # Show failed test logs only
          - 'verbose' # All test logs - use with caution!
        default: 'minimal'

permissions:
  contents: read

jobs:
  cross-platform-regression:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 45
    env:
      # PLATFORM is deliberately NOT set. getNetworkTarget() throws for anything but ios/android,
      # and global-setup.ts guards with `if (platform)`, so leaving it unset is the supported way
      # to run a multi-platform project. It also makes playwright.config.ts resolve
      # getWorkersCount(undefined) === 1, which is exactly what a cross-platform run needs.
      CI: 1
      # Mandatory, not cosmetic: playwright.config.ts turns the Allure reporter on whenever
      # CI === '1' unless this is exactly 'false'.
      ALLURE_ENABLED: 'false'
      _TESTING: 1 # Always hide webdriver logs (@appium/support/ flag)
      APK_URL: ${{ inputs.APK_URL }}
      IOS_APP_PATH_PREFIX: './extracted/Session.app'
      SESSION_DESKTOP_ROOT: ${{ github.workspace }}/desktop
      # capabilities_android.ts calls getAndroidApk() at module load, even on a run with no
      # Android client, so these have to be non-empty (same trick as ios-regression.yml).
      ANDROID_APK: '<just_not_empty>'
      APPIUM_ADB_FULL_PATH: '<just_not_empty>'
      ANDROID_SDK_ROOT: '<just_not_empty>'
      PLAYWRIGHT_RETRIES_COUNT: ${{ inputs.PLAYWRIGHT_RETRIES_COUNT }}
      # NETWORK_TARGET is the single switch: the harness translates it into iOS launch arguments and
      # Desktop's LOCAL_DEVNET_SEED_URL, and refuses to start if the two end up disagreeing.
      NETWORK_TARGET: ${{ inputs.NETWORK_TARGET }}
      DEVNET_SEED_URL: ${{ vars.DEVNET_SEED_URL }}
      PRINT_FAILED_TEST_LOGS: ${{ inputs.LOG_LEVEL != 'minimal' && '1' || '0' }} # Show stdout/stderr if test fails (@session-foundation/playwright-reporter/ flag)
      PRINT_ONGOING_TEST_LOGS: ${{ inputs.LOG_LEVEL == 'verbose' && '1' || '0' }} # Show everything as it happens (@session-foundation/playwright-reporter/ flag)

    steps:
      - name: Checkout the test harness
        uses: actions/checkout@v6
        with:
          lfs: true
          # run/localizer/lib backs tStripped(), used by DesktopWrapper.changeDisplayName
          submodules: 'recursive'

      # NOTE there is deliberately no network-pinning step here any more. `pinPlatformsToNetworkTarget`
      # (global-setup.ts) now derives Desktop's LOCAL_DEVNET_SEED_URL from NETWORK_TARGET itself, so
      # local runs and CI go through exactly the same code instead of this job re-implementing it in
      # bash. `assertRequestedDevnetsReachable` then verifies the devnet is actually usable — it POSTs
      # get_n_service_nodes and requires registered nodes, which a curl-any-HTTP-status probe could not
      # do — and refuses to start the run if any platform disagrees about the network.

      - name: Checkout session-desktop
        uses: actions/checkout@v6
        with:
          repository: session-foundation/session-desktop
          ref: ${{ inputs.DESKTOP_REF }}
          path: desktop
          # ts/localization and dynamic_assets are both required by the build
          submodules: 'recursive'

      - name: Build session-desktop from source
        uses: ./github/actions/build-session-desktop
        with:
          working-directory: desktop
          cache_suffix: mac-arm64

      - name: Download ipa and extract it
        env:
          APK_URL: ${{ inputs.APK_URL }}
        run: |
          # -f: a 404/403 must fail here, not write an HTML error body that `tar` then chokes on.
          # -L: release/artifact URLs redirect (e.g. to objects.githubusercontent.com).
          curl -fL -o session-ios.sim.tar.xz "$APK_URL"
          ls
          pwd
          tar -tf session-ios.sim.tar.xz
          tar xf session-ios.sim.tar.xz
          mkdir -p extracted
          mv session-ios-*-sim/*.app extracted/
          ls extracted

      - name: Setup for both platforms
        uses: ./github/actions/setup

      - name: Stop simulators
        shell: bash
        run: |
          npx --yes ts-node scripts/stop_ios.ts

      # Not ./github/actions/list-tests: it builds a "(?=.*@PLATFORM)(?=.*@RISK)" grep, which
      # can't express a spec-path selector. Giving that action a GREP input is a follow-up.
      # Watch this output: a mistyped SPEC_GREP collects 0 tests and the run still goes green.
      - name: List tests part of this run
        shell: bash
        env:
          SPEC_GREP: ${{ inputs.SPEC_GREP }}
        run: |
          npx playwright test --list --reporter list --project cross-platform --grep "$SPEC_GREP"

      - name: Run the cross-platform tests
        env:
          # Only needs to cover the iOS clients of a single test (1 for the display-name specs);
          # Desktop windows aren't pooled. UDIDs come from the committed ci-simulators.json.
          DEVICES_PER_TEST_COUNT: 1
          SPEC_GREP: ${{ inputs.SPEC_GREP }}
        run: |
          pwd
          npx playwright test --project cross-platform --grep "$SPEC_GREP"

      - name: Upload results of this run
        uses: ./github/actions/upload-test-results
        if: always()
        with:
          PLATFORM: 'cross-platform'
          UPLOAD_IDENTIFIER: 'cross-platform-test-run'

      - name: Upload csv of this whole run
        uses: ./github/actions/upload-csv-test-results
        if: always()
        with:
          PLATFORM: 'cross-platform'

      - name: Stop simulators and any leftover Electron
        if: always()
        continue-on-error: true # just so we don't fail
        shell: bash
        run: |
          npx --yes ts-node scripts/stop_ios.ts
          # Match the main script this run launched, NOT a bare 'Electron' — the runner is a shared
          # Mac and a broad pattern would take out unrelated Electron apps on it. Every window the
          # harness spawns carries this path as its first arg (run/desktop/open.ts).
          pkill -9 -f "${GITHUB_WORKSPACE}/desktop/app/ts/mains/main_node.js" || true
